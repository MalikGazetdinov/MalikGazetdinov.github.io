
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Книга ан-Нур</title>

  <!-- PDF.js: чтение PDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <!-- StPageFlip: анимация перелистывания -->
  <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.min.js"></script>

  <style>
    :root {
      --green: #b9d7a5;
      --dark-green: #36533c;
      --gold: #d6bd7b;
      --paper: #fffdf6;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: #27352a;
      font-family: Georgia, "Times New Roman", serif;
      background:
        radial-gradient(ellipse at top, #faf8ef 0%, #e8e5d9 58%, #d5d3c8 100%);
    }

    header {
      padding: 24px 16px 10px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      color: var(--dark-green);
      font-size: clamp(27px, 5vw, 42px);
      font-weight: normal;
      letter-spacing: 2px;
    }

    header p {
      margin: 8px 0 0;
      color: #687568;
      font-style: italic;
    }

    main {
      width: min(100%, 1100px);
      margin: 0 auto;
      padding: 20px 16px 34px;
    }

    .reader {
      display: flex;
      min-height: 520px;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    #book {
      margin: auto;
    }

    .page {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background: var(--paper);
      box-shadow: inset 0 0 18px rgba(91, 73, 42, .08);
    }

    .page canvas {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: white;
    }

    /* Кожаная обложка */
    .cover {
      flex-direction: column;
      padding: 28px;
      color: #304b34;
      text-align: center;
      background:
        radial-gradient(ellipse at 25% 20%, rgba(255,255,255,.42), transparent 42%),
        radial-gradient(ellipse at 80% 80%, rgba(75,103,65,.16), transparent 45%),
        repeating-linear-gradient(8deg, rgba(255,255,255,.035) 0 2px, rgba(70,90,57,.025) 2px 4px),
        linear-gradient(135deg, #c9dfb7, #a9ca94 55%, #bed8a9);
      border: 9px solid #8eaa79;
      outline: 1px solid rgba(255,255,255,.7);
      outline-offset: -16px;
    }

    .cover::before {
      position: absolute;
      inset: 13px;
      border: 1px solid rgba(255,255,255,.58);
      content: "";
      pointer-events: none;
    }

    .cover::after {
      position: absolute;
      inset: 22px;
      border: 1px solid rgba(71,101,61,.25);
      content: "";
      pointer-events: none;
    }

    .cover-ornament {
      margin-bottom: 30px;
      color: #718b5e;
      font-size: 28px;
    }

    .cover h2 {
      margin: 0;
      color: #304b34;
      font-size: clamp(34px, 6vw, 54px);
      font-weight: normal;
      letter-spacing: 3px;
      text-shadow: 0 1px rgba(255,255,255,.65);
    }

    .cover .subtitle {
      max-width: 240px;
      margin-top: 22px;
      color: #526b4d;
      font-size: 16px;
      line-height: 1.6;
      font-style: italic;
    }

    .cover .bottom-ornament {
      position: absolute;
      bottom: 42px;
      color: #718b5e;
      font-size: 23px;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-top: 20px;
    }

    button {
      min-width: 112px;
      padding: 11px 18px;
      border: 1px solid #718b68;
      border-radius: 24px;
      color: #fff;
      background: var(--dark-green);
      font: inherit;
      cursor: pointer;
      transition: background .2s, transform .2s;
    }

    button:hover:not(:disabled) {
      background: #4d704f;
      transform: translateY(-1px);
    }

    button:disabled {
      opacity: .42;
      cursor: not-allowed;
    }

    #pageInfo {
      min-width: 110px;
      color: #4d5b4e;
      text-align: center;
      font-size: 15px;
    }

    #status {
      min-height: 24px;
      margin: 14px 0 0;
      color: #667166;
      text-align: center;
      font-size: 14px;
    }

    #status.error { color: #a33b32; }

    @media (max-width: 600px) {
      main { padding-inline: 8px; }
      .reader { min-height: 420px; }
      button { min-width: 98px; padding: 10px 14px; }
    }
  </style>
</head>

<body>
  <header>
    <h1>Книга ан-Нур</h1>
    <p>Листайте страницы, чтобы начать чтение</p>
  </header>

  <main>
    <div class="reader">
      <div id="book"></div>
    </div>

    <nav class="controls" aria-label="Управление книгой">
      <button id="prevBtn" type="button">← Назад</button>
      <span id="pageInfo">Загрузка…</span>
      <button id="nextBtn" type="button">Вперёд →</button>
    </nav>

    <p id="status" role="status">Загружаем книгу…</p>
  </main>

  <script>
    // Укажите прямую ссылку на PDF-файл:
    const PDF_URL = "https://drive.google.com/file/d/1D0Danhw_VNziRpdBKQ5w242yoSgw5PQ6/preview";

    pdfjsLib.GlobalWorkerOptions.workerSrc =
      "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

    const bookElement = document.getElementById("book");
    const statusElement = document.getElementById("status");
    const pageInfo = document.getElementById("pageInfo");
    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");

    let pageFlip = null;
    let totalPdfPages = 0;

    function setStatus(message, isError = false) {
      statusElement.textContent = message;
      statusElement.classList.toggle("error", isError);
    }

    function updateControls() {
      if (!pageFlip) return;

      const current = pageFlip.getCurrentPageIndex();
      const total = pageFlip.getPageCount();

      pageInfo.textContent = `${current + 1} / ${total}`;
      prevBtn.disabled = current <= 0;
      nextBtn.disabled = current >= total - 1;
    }

    function makeCover() {
      const cover = document.createElement("div");
      cover.className = "page cover";
      cover.innerHTML = `
        <div class="cover-ornament">❧</div>
        <h2>ан-Нур</h2>
        <div class="subtitle">Свет, который озаряет сердце и разум</div>
        <div class="bottom-ornament">✦</div>
      `;
      return cover;
    }

    async function renderPdfPage(pdf, pageNumber, width, height) {
      const page = await pdf.getPage(pageNumber);
      const baseViewport = page.getViewport({ scale: 1 });
      const scale = Math.min(width / baseViewport.width, height / baseViewport.height);
      const viewport = page.getViewport({ scale });

      const canvas = document.createElement("canvas");
      const context = canvas.getContext("2d", { alpha: false });
      const pixelRatio = Math.min(window.devicePixelRatio || 1, 2);

      canvas.width = Math.floor(viewport.width * pixelRatio);
      canvas.height = Math.floor(viewport.height * pixelRatio);
      canvas.style.width = `${viewport.width}px`;
      canvas.style.height = `${viewport.height}px`;

      await page.render({
        canvasContext: context,
        viewport,
        transform: pixelRatio !== 1
          ? [pixelRatio, 0, 0, pixelRatio, 0, 0]
          : null
      }).promise;

      const pageElement = document.createElement("div");
      pageElement.className = "page";
      pageElement.appendChild(canvas);
      return pageElement;
    }

    async function loadBook() {
      if (PDF_URL === "https://drive.google.com/file/d/1D0Danhw_VNziRpdBKQ5w242yoSgw5PQ6/preview") {
        setStatus("Сначала замените PDF_URL в коде на ссылку на ваш PDF-файл.", true);
        pageInfo.textContent = "Нет PDF";
        return;
      }

      try {
        const pdf = await pdfjsLib.getDocument({
          url: PDF_URL,
          withCredentials: false
        }).promise;

        totalPdfPages = pdf.numPages;

        // Размер страницы-книги подбирается по ширине экрана.
        const isMobile = window.innerWidth < 650;
        const pageWidth = isMobile ? 300 : 410;
        const pageHeight = isMobile ? 420 : 560;

        const pages = [makeCover()];

        for (let number = 1; number <= totalPdfPages; number++) {
          setStatus(`Подготавливаем страницы: ${number} из ${totalPdfPages}…`);
          pages.push(await renderPdfPage(pdf, number, pageWidth, pageHeight));
        }

        pageFlip = new St.PageFlip(bookElement, {
          width: pageWidth,
          height: pageHeight,
          size: "stretch",
          minWidth: 260,
          maxWidth: 820,
          minHeight: 360,
          maxHeight: 1120,
          showCover: true,
          usePortrait: true,
          drawShadow: true,
          flippingTime: 850,
          maxShadowOpacity: 0.35,
          mobileScrollSupport: false
        });

        pageFlip.loadFromHTML(pages);
        pageFlip.on("flip", updateControls);
        pageFlip.on("init", updateControls);

        setStatus("Готово. Листайте книгу мышью, пальцем или кнопками.");
        updateControls();
      } catch (error) {
        console.error(error);
        setStatus(
          "Не удалось загрузить PDF. Проверьте ссылку и доступ CORS; также можно положить PDF рядом с HTML-файлом.",
          true
        );
        pageInfo.textContent = "Ошибка загрузки";
      }
    }

    prevBtn.addEventListener("click", () => pageFlip?.flipPrev());
    nextBtn.addEventListener("click", () => pageFlip?.flipNext());

    document.addEventListener("keydown", (event) => {
      if (event.key === "ArrowLeft") pageFlip?.flipPrev();
      if (event.key === "ArrowRight") pageFlip?.flipNext();
    });

    loadBook();
  </script>
</body>
</html>
