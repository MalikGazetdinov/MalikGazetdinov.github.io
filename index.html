<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Просмотр PDF</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #202124;
      color: #fff;
      font: 16px Arial, sans-serif;
    }

    main {
      width: min(100%, 1000px);
      text-align: center;
    }

    #status {
      margin-bottom: 16px;
      color: #ddd;
    }

    #viewer {
      min-height: 70vh;
      display: grid;
      place-items: center;
    }

    #viewer canvas {
      display: block;
      max-width: 100%;
      max-height: 78vh;
      height: auto;
      box-shadow: 0 4px 24px #0008;
      background: white;
    }

    .controls {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 16px;
      margin-top: 16px;
    }

    button {
      padding: 10px 18px;
      border: 0;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
    }

    button:disabled {
      opacity: .45;
      cursor: default;
    }
  </style>
</head>
<body>
  <main>
    <div id="status">Загрузка PDF…</div>
    <div id="viewer"></div>

    <div class="controls">
      <button id="prev" disabled>Назад</button>
      <span id="page-info">— / —</span>
      <button id="next" disabled>Вперёд</button>
    </div>
  </main>

  <!-- PDF.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

  <script>
    // Вставьте URL веб-приложения Google Apps Script.
    const PROXY_URL = "https://script.google.com/macros/s/AKfycbwrafLq34jZCWaUTcAucHMGVv8mY_0cOLFOgM3Jt-_oII8cjSp6I8ZS_p-nyCXWUvfI/exec";

    pdfjsLib.GlobalWorkerOptions.workerSrc =
      "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

    const statusEl = document.getElementById("status");
    const viewerEl = document.getElementById("viewer");
    const pageInfoEl = document.getElementById("page-info");
    const prevButton = document.getElementById("prev");
    const nextButton = document.getElementById("next");

    let pdf = null;
    let pageNumber = 1;
    let rendering = false;
    let renderAgain = false;

    async function loadPdf() {
      try {
        if (!PROXY_URL.startsWith("https://")) {
          throw new Error("Укажите URL веб-приложения Apps Script в PROXY_URL.");
        }

        const response = await fetch(PROXY_URL);

        if (!response.ok) {
          throw new Error(`Сервер вернул ошибку HTTP ${response.status}.`);
        }

        const result = await response.json();

        if (!result.base64) {
          throw new Error(result.error || "Сервер не вернул файл PDF.");
        }

        const binary = atob(result.base64);
        const bytes = new Uint8Array(binary.length);

        for (let i = 0; i < binary.length; i++) {
          bytes[i] = binary.charCodeAt(i);
        }

        pdf = await pdfjsLib.getDocument({ data: bytes }).promise;

        statusEl.textContent = "";
        prevButton.disabled = false;
        nextButton.disabled = false;

        await renderPage();
      } catch (error) {
        console.error(error);
        statusEl.textContent =
          "Не удалось загрузить PDF: " + error.message;
      }
    }

    async function renderPage() {
      if (!pdf) return;

      if (rendering) {
        renderAgain = true;
        return;
      }

      rendering = true;

      try {
        const page = await pdf.getPage(pageNumber);
        const baseViewport = page.getViewport({ scale: 1 });
        const maxWidth = Math.min(window.innerWidth - 48, 1000);
        const maxHeight = window.innerHeight * 0.76;
        const scale = Math.min(
          maxWidth / baseViewport.width,
          maxHeight / baseViewport.height
        );

        const viewport = page.getViewport({ scale });
        const canvas = document.createElement("canvas");
        const context = canvas.getContext("2d");

        canvas.width = Math.floor(viewport.width);
        canvas.height = Math.floor(viewport.height);

        viewerEl.replaceChildren(canvas);

        await page.render({
          canvasContext: context,
          viewport
        }).promise;

        pageInfoEl.textContent = `${pageNumber} / ${pdf.numPages}`;
        prevButton.disabled = pageNumber <= 1;
        nextButton.disabled = pageNumber >= pdf.numPages;
      } catch (error) {
        console.error(error);
        statusEl.textContent = "Ошибка отображения страницы: " + error.message;
      } finally {
        rendering = false;

        if (renderAgain) {
          renderAgain = false;
          renderPage();
        }
      }
    }

    prevButton.addEventListener("click", () => {
      if (pdf && pageNumber > 1) {
        pageNumber--;
        renderPage();
      }
    });

    nextButton.addEventListener("click", () => {
      if (pdf && pageNumber < pdf.numPages) {
        pageNumber++;
        renderPage();
      }
    });

    window.addEventListener("resize", renderPage);

    loadPdf();
  </script>
</body>
</html>
